<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alok's Mega Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🚀 Alok's Super Creative Site 🚀</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#quiz">Quiz</a>
      <a href="#carousel">Gallery</a>
      <a href="#api">Jokes</a>
    </nav>
  </header>

  <main>
    <!-- Home Section -->
    <section id="home" class="card-section fade-in">
      <div class="card">💻 Learn Web Dev</div>
      <div class="card">🎯 Build Projects</div>
      <div class="card">🚀 Master CSS & JS</div>
    </section>

    <!-- Quiz Section -->
    <section id="quiz" class="quiz-section fade-in">
      <h2>🎓 Quiz Yourself!</h2>
      <div class="quiz-container">
        <div id="question" class="question">Question here</div>
        <div id="options" class="options"></div>
        <button id="next" class="btn">Next Question</button>
      </div>
    </section>

    <!-- Image Carousel -->
    <section id="carousel" class="carousel-section fade-in">
      <h2>🖼️ Photo Gallery</h2>
      <div class="carousel">
        <img src="https://picsum.photos/500/300?random=1" class="slide active" alt="Image 1">
        <img src="https://picsum.photos/500/300?random=2" class="slide" alt="Image 2">
        <img src="https://picsum.photos/500/300?random=3" class="slide" alt="Image 3">
        <img src="https://picsum.photos/500/300?random=4" class="slide" alt="Image 4">
      </div>
      <div class="carousel-controls">
        <button id="prev" class="btn">Prev</button>
        <button id="nextSlide" class="btn">Next</button>
      </div>
    </section>

    <!-- API Joke Section -->
    <section id="api" class="api-section fade-in">
      <h2>😂 Get a Random Joke</h2>
      <button id="getJoke" class="btn">Tell Me a Joke</button>
      <div id="joke" class="joke"></div>
    </section>
  </main>

  <footer>
    <p>© 2025 Alok Kumar Shaw | All Rights Reserved</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
